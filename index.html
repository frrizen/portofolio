<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Pribadi - Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dark-mode">
    <!-- Background Decor (Bulatan Cahaya Glowing) -->
    <div class="glow-bg"></div>

    <div class="container">
        <div class="profile-card">
            <!-- Tombol Toggle Tema (Terang/Gelap) -->
            <button id="theme-toggle" class="theme-btn" title="Ubah Tema">
                <i class="fas fa-moon"></i>
            </button>

            <div class="avatar-container">
                <img src="kucing.jpg" alt="Foto Profil" id="avatar">
                <span class="status-badge" title="Aktif"></span>
            </div>
            
            <h1 id="name">Frista Ayung Pratama</h1>
            <p class="title"><span id="typing-text"></span><span class="cursor">|</span></p>
            <p class="bio" id="greeting">Selamat datang di profil GitHub saya!</p>
            
            <div class="social-links">
                <a href="https://github.com/" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
                <a href="https://discord.com/" target="_blank" title="Discord"><i class="fab fa-discord"></i></a>
                <a href="mailto:emailanda@domain.com" title="Email"><i class="fas fa-envelope"></i></a>
            </div>

            <div class="action-buttons">
                <button id="contact-btn">Hubungi Saya</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
